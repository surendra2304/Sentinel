version: "3.8"

services:
  sentinel-db:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SENTINEL_DB_USER:-sentinel}
      POSTGRES_PASSWORD: ${SENTINEL_DB_PASSWORD:-sentinel_secret_dev}
      POSTGRES_DB: ${SENTINEL_DB_NAME:-sentinel_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  sentinel-minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: sentinel-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SENTINEL_S3_ACCESS_KEY:-sentinel_minio_user}
      MINIO_ROOT_PASSWORD: ${SENTINEL_S3_SECRET_KEY:-sentinel_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 3

  sentinel-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sentinel-api
    restart: unless-stopped
    environment:
      - SENTINEL_ENVIRONMENT=development
      - SENTINEL_DEBUG=true
      - SENTINEL_DB_HOST=sentinel-db
      - SENTINEL_DB_PORT=5432
      - SENTINEL_DB_USER=sentinel
      - SENTINEL_DB_PASSWORD=sentinel_secret_dev
      - SENTINEL_DB_NAME=sentinel_db
      - SENTINEL_S3_ENDPOINT=sentinel-minio:9000
      - SENTINEL_S3_ACCESS_KEY=sentinel_minio_user
      - SENTINEL_S3_SECRET_KEY=sentinel_minio_secret
      - SENTINEL_S3_BUCKET_NAME=sentinel-evidence
    ports:
      - "8000:8000"
    depends_on:
      sentinel-db:
        condition: service_healthy
      sentinel-minio:
        condition: service_healthy
    volumes:
      - .:/app
      - audit_logs:/app/logs

volumes:
  postgres_data:
  minio_data:
  audit_logs:
