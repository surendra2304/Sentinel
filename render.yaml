services:
  - type: web
    name: sentinel
    env: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: SENTINEL_ENVIRONMENT
        value: "production"
      - key: SENTINEL_API_KEY
        value: "sentinel_api"
      - key: SENTINEL_STORAGE_BACKEND
        value: "memory"
      - key: SENTINEL_S3_BACKEND
        value: "local"
      - key: SENTINEL_AUDIT_SIGNING_KEY
        value: "entropy-production-signing-key-0123456789"
      # Live Mesh Interconnects
      - key: FRIDAY_URL
        value: "https://friday-zw59.onrender.com"
      - key: FRIDAY_API_KEY
        value: "friday_api"
      - key: SENTINEL_FRIDAY_API_KEY
        value: "friday_api"
      - key: INFERENCE_URL
        value: "https://inference-r1sn.onrender.com"
      - key: INFERENCE_API_KEY
        value: "inference_api"
      - key: STRATEX_URL
        value: "https://stratex-8wj1.onrender.com"
      - key: STRATEX_API_KEY
        value: "stratex_api"
      - key: MEMORA_URL
        value: "https://memora-cavc.onrender.com"
      - key: MEMORA_API_KEY
        value: "memora_api"
      - key: INTELX_URL
        value: "https://intelx-mygl.onrender.com"
      - key: INTELX_API_KEY
        value: "intelx_api"
      - key: FUTURIS_URL
        value: "https://futuris-th6f.onrender.com"
      - key: FUTURIS_API_KEY
        value: "futuris_api"
      - key: CORTEX_URL
        value: "https://cortex-0m7c.onrender.com"
      - key: CORTEX_API_KEY
        value: "cortex_api"
      - key: FORGE_URL
        value: "https://forge-u98k.onrender.com"
      - key: FORGE_API_KEY
        value: "forge_api"
