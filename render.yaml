services:
  - type: web
    name: friday-sentinel
    env: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: SENTINEL_LLM_API_KEY
        sync: false
      - key: SENTINEL_LLM_BASE_URL
        sync: false
      - key: SENTINEL_FRIDAY_API_KEY
        sync: false
      - key: SENTINEL_API_KEY
        sync: false
      - key: SENTINEL_DB_PASSWORD
        sync: false
      - key: SENTINEL_S3_SECRET_KEY
        sync: false
