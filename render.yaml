services:
  - type: web
    name: sentinel
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: SENTINEL_ENVIRONMENT
        value: "production"
      - key: SENTINEL_API_KEY
        sync: false
      - key: SENTINEL_CAPABILITY_SIGNING_KEY
        sync: false
      - key: SENTINEL_STORAGE_BACKEND
        value: "memory"
      - key: SENTINEL_S3_BACKEND
        value: "local"
      - key: SENTINEL_AUDIT_SIGNING_KEY
        sync: false
      # Live Mesh Interconnects
      - key: FRIDAY_URL
        value: "https://friday-zw59.onrender.com"
      - key: FRIDAY_API_KEY
        sync: false
      - key: SENTINEL_FRIDAY_API_KEY
        sync: false
      - key: INFERENCE_URL
        value: "https://inference-r1sn.onrender.com"
      - key: INFERENCE_API_KEY
        sync: false
      - key: STRATEX_URL
        value: "https://stratex-8wj1.onrender.com"
      - key: STRATEX_API_KEY
        sync: false
      - key: MEMORA_URL
        value: "https://memora-cavc.onrender.com"
      - key: SENTINEL_MEMORA_EVENTS_ENABLED
        value: "true"
      - key: SENTINEL_MEMORA_EVENTS_POLL_SECONDS
        value: "30"
      - key: MEMORA_API_KEY
        sync: false
      - key: INTELX_URL
        value: "https://intelx-mygl.onrender.com"
      - key: INTELX_API_KEY
        sync: false
      - key: FUTURIS_URL
        value: "https://futuris-th6f.onrender.com"
      - key: FUTURIS_API_KEY
        sync: false
      - key: CORTEX_URL
        value: "https://cortex-0m7c.onrender.com"
      - key: CORTEX_API_KEY
        sync: false
      - key: FORGE_URL
        value: "https://forge-e9kl.onrender.com"
      - key: FORGE_API_KEY
        sync: false
