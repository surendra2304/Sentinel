# Sentinel Web Security Assessment & Misconfiguration Baseline Rules
version: "1.0.0"

# Security Headers Requirements
security_headers:
  - header: "Strict-Transport-Security"
    name: "HSTS Missing"
    severity: "MEDIUM"
    description: "HTTP Strict Transport Security (HSTS) header is missing, exposing users to SSL-stripping attacks."
    remediation: "Add 'Strict-Transport-Security: max-age=31536000; includeSubDomains; preload' to response headers."
  - header: "Content-Security-Policy"
    name: "CSP Missing"
    severity: "MEDIUM"
    description: "Content Security Policy (CSP) header is missing, leaving application vulnerable to Cross-Site Scripting (XSS) and data injection."
    remediation: "Define and enforce a robust Content-Security-Policy restricting script-src, object-src, and frame-ancestors."
  - header: "X-Frame-Options"
    name: "X-Frame-Options Missing"
    severity: "LOW"
    description: "X-Frame-Options header is missing, allowing clickjacking via iframe embedding."
    remediation: "Set 'X-Frame-Options: DENY' or 'SAMEORIGIN'."
  - header: "X-Content-Type-Options"
    name: "X-Content-Type-Options Missing"
    severity: "LOW"
    description: "X-Content-Type-Options header is missing, allowing MIME-sniffing vulnerabilities."
    remediation: "Set 'X-Content-Type-Options: nosniff'."
  - header: "Referrer-Policy"
    name: "Referrer-Policy Missing"
    severity: "LOW"
    description: "Referrer-Policy header is missing, potentially leaking sensitive path parameters to third parties."
    remediation: "Set 'Referrer-Policy: strict-origin-when-cross-origin'."

# Cookie Security Attributes Baseline
cookie_rules:
  - attribute: "HttpOnly"
    severity: "MEDIUM"
    description: "Session cookie lacks the HttpOnly flag, allowing client-side scripts to access it."
    remediation: "Set 'HttpOnly' flag on all sensitive session and auth cookies."
  - attribute: "Secure"
    severity: "MEDIUM"
    description: "Session cookie lacks the Secure flag, transmitting credentials over unencrypted HTTP."
    remediation: "Set 'Secure' flag on all session cookies to enforce HTTPS-only transmission."
  - attribute: "SameSite"
    severity: "LOW"
    description: "Session cookie lacks explicit SameSite attribute (Lax or Strict), increasing CSRF exposure."
    remediation: "Set 'SameSite=Lax' or 'SameSite=Strict' on all cookies."

# Sensitive Paths & Backup Files Wordlist
sensitive_paths:
  - path: "/.env"
    name: "Exposed Environment File"
    severity: "CRITICAL"
  - path: "/.git/HEAD"
    name: "Exposed Git Repository"
    severity: "HIGH"
  - path: "/backup.zip"
    name: "Exposed Database/App Backup"
    severity: "HIGH"
  - path: "/wp-config.php.bak"
    name: "Exposed Configuration Backup"
    severity: "HIGH"
  - path: "/server-status"
    name: "Exposed Server Status Page"
    severity: "MEDIUM"
