version: "1.0.0"

linux_rules:
  - id: "EP-LNX-001"
    name: "SSH PermitRootLogin Enabled"
    severity: "HIGH"
    description: "SSH daemon permits direct root login, allowing potential brute force and lateral movement directly to root."
    remediation: "Set 'PermitRootLogin no' in /etc/ssh/sshd_config and restart sshd."
  - id: "EP-LNX-002"
    name: "SSH Password Authentication Enabled"
    severity: "MEDIUM"
    description: "SSH daemon permits password authentication instead of requiring cryptographic key pairs."
    remediation: "Set 'PasswordAuthentication no' in /etc/ssh/sshd_config and deploy authorized SSH keys."
  - id: "EP-LNX-003"
    name: "Sudo NOPASSWD Misconfiguration"
    severity: "HIGH"
    description: "User or group has passwordless sudo configured (NOPASSWD: ALL), enabling trivial privilege escalation."
    remediation: "Remove NOPASSWD directive from /etc/sudoers or /etc/sudoers.d/* files."
  - id: "EP-LNX-004"
    name: "World-Writable Sensitive Path"
    severity: "CRITICAL"
    description: "Sensitive system directories (/etc, /root, /bin, /sbin) or scripts contain world-writable permissions."
    remediation: "Audit file permissions: chmod o-w on affected system paths."
  - id: "EP-LNX-005"
    name: "Suspicious Cron Persistence"
    severity: "HIGH"
    description: "Cron job or scheduled task executes binaries or scripts located in user-writable directories (/tmp, /dev/shm, /var/tmp)."
    remediation: "Inspect and remove untrusted cron jobs pointing to writable or temporary locations."
  - id: "EP-LNX-006"
    name: "Anomalous Systemd Service Unit"
    severity: "HIGH"
    description: "Systemd unit executes from temporary or user-controlled paths (/tmp, /dev/shm) or has weak unit file permissions."
    remediation: "Review unit ExecStart path and ensure ownership is restricted to root:root with 0644 permissions."
  - id: "EP-LNX-007"
    name: "Privilege Escalation Exposure - Writable Root Binary"
    severity: "CRITICAL"
    description: "A process running as root or a privileged service executes a binary with write permissions granted to standard users."
    remediation: "Change ownership to root and remove write permissions for non-privileged accounts."

windows_rules:
  - id: "EP-WIN-001"
    name: "AlwaysInstallElevated Enabled"
    severity: "HIGH"
    description: "AlwaysInstallElevated registry policy is enabled in HKLM or HKCU, allowing non-administrative users to execute MSI installers with elevated SYSTEM privileges."
    remediation: "Set AlwaysInstallElevated to 0 in HKEY_LOCAL_MACHINE and HKEY_CURRENT_USER\\Software\\Policies\\Microsoft\\Windows\\Installer."
  - id: "EP-WIN-002"
    name: "Windows AutoAdminLogon Configured"
    severity: "HIGH"
    description: "Windows AutoAdminLogon is enabled with stored plaintext credentials in Winlogon registry keys."
    remediation: "Disable AutoAdminLogon by setting AutoAdminLogon to '0' and clearing DefaultPassword in HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon."
  - id: "EP-WIN-003"
    name: "Local Administrator Password Solution (LAPS) Missing"
    severity: "MEDIUM"
    description: "Microsoft LAPS is not installed or configured, indicating potential shared static local administrator passwords across endpoints."
    remediation: "Deploy and enforce Microsoft LAPS (Windows LAPS) via Group Policy or Intune."
  - id: "EP-WIN-004"
    name: "Suspicious Registry Run Key Persistence"
    severity: "HIGH"
    description: "Startup Run registry keys point to executables located in temporary or user-writable locations (AppData\\Local\\Temp, Public, Downloads)."
    remediation: "Audit and remove unauthorized Run keys in HKLM/HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run."
  - id: "EP-WIN-005"
    name: "Unquoted Service Path with Writable Intermediary Directory"
    severity: "HIGH"
    description: "A Windows service running as LocalSystem has an unquoted path containing spaces in a writable directory, allowing binary planting."
    remediation: "Wrap service binary path in quotes in service configuration."
  - id: "EP-WIN-006"
    name: "Unnecessary High-Risk Service Running"
    severity: "MEDIUM"
    description: "High-risk legacy services (e.g. RemoteRegistry, Telnet, SMBv1) are actively running on the endpoint."
    remediation: "Disable unneeded legacy services via services.msc or PowerShell."

macos_rules:
  - id: "EP-MAC-001"
    name: "Suspicious LaunchAgent/LaunchDaemon Persistence"
    severity: "HIGH"
    description: "LaunchAgent or LaunchDaemon plist executes scripts or binaries from /tmp, /Users/Shared, or user Downloads."
    remediation: "Inspect and delete untrusted plist definitions in /Library/LaunchDaemons, /Library/LaunchAgents, or ~/Library/LaunchAgents."
  - id: "EP-MAC-002"
    name: "SSH Remote Login Enabled without Hardening"
    severity: "MEDIUM"
    description: "macOS Remote Login (sshd) is enabled without restricting administrative root access."
    remediation: "Disable Remote Login if unused or harden sshd_config via MDM / terminal."
  - id: "EP-MAC-003"
    name: "World-Writable Sensitive Directory in macOS"
    severity: "HIGH"
    description: "Critical application or daemon support directories have world-writable permissions."
    remediation: "Restore standard POSIX permissions on macOS system directories."